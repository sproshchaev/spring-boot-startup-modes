spring.application.name=startup-modes
# bench.py polls this port
server.port=8080
# keep the in-memory database while the JVM lives: before a CRaC checkpoint Hikari closes all
# connections, and by default H2 drops an in-memory database when its last connection closes
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
# bench.py reads the runtime name and version from /actuator/info
management.endpoints.web.exposure.include=health,info
management.info.java.enabled=true
